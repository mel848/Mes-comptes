<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#6d55e3">
<title>MesComptes</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Clair et doux : fond lavande, cartes blanches très arrondies, boutons pilule violets, dégradé menthe → violet pour les accents */
:root{
  --bg:#f3f1fb; --surface:#ffffff; --sunk:#f7f5fe; --ink:#1c1a3a; --muted:#6c6893; --line:#e4e0f5;
  --accent:#6d55e3; --accent-ink:#ffffff; --accent-soft:#ece8fd;
  --mint:#8dd5c9; --mint-ink:#1c6d63; --mint-soft:#e5f6f2;
  --grad:linear-gradient(135deg,#94dacd 0%,#8f7cf0 55%,#6d55e3 100%);
  --debit:#d2405a; --credit:#178a72; --future:#e9f7f3; --future-ink:#1c6d63; --warn:#b45f06;
  --shadow:0 8px 28px rgb(76 58 170 / .08);
  --f-display:"Outfit",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13152a; --surface:#1c1f3a; --sunk:#171a32; --ink:#ecebf9; --muted:#9e9bc3; --line:#2c3054;
  --accent:#8b76f2; --accent-ink:#ffffff; --accent-soft:#2c2860;
  --mint:#7fcfc2; --mint-ink:#a3e6da; --mint-soft:#1b3138;
  --debit:#ff8b9c; --credit:#7fd9c5; --future:#1a2d35; --future-ink:#a3e6da; --warn:#f5b45c;
  --shadow:0 8px 28px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13152a; --surface:#1c1f3a; --sunk:#171a32; --ink:#ecebf9; --muted:#9e9bc3; --line:#2c3054;
  --accent:#8b76f2; --accent-ink:#ffffff; --accent-soft:#2c2860;
  --mint:#7fcfc2; --mint-ink:#a3e6da; --mint-soft:#1b3138;
  --debit:#ff8b9c; --credit:#7fd9c5; --future:#1a2d35; --future-ink:#a3e6da; --warn:#f5b45c;
  --shadow:0 8px 28px rgb(0 0 0 / .25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.debit{color:var(--debit)} .credit{color:var(--credit)}

/* en-tête */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:30px;letter-spacing:-.01em}
.logo{width:46px;height:46px;border-radius:15px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:24px;box-shadow:0 6px 16px rgb(109 85 227 / .3)}
.brand h1 span{color:var(--accent)}
.soldes{display:flex;flex-wrap:wrap;gap:10px}
.solde{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 18px;min-width:0;box-shadow:var(--shadow)}
.solde .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.solde .val{font-family:var(--f-display);font-size:24px;font-weight:700}
.solde.main{background:var(--grad);border-color:transparent;color:#fff}
.solde.main .val{text-shadow:0 1px 2px rgb(40 20 120 / .25)}
.solde.main .lbl{color:inherit;opacity:.85}

nav.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button{font-family:var(--f-display);font-size:16.5px}
nav.tabs button[aria-current="true"]{border-bottom-width:3px;border-radius:0}

.banner{background:var(--future);color:var(--future-ink);border-radius:18px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* saisie rapide */
.quick{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.quick label{font-weight:600}
.qrow{display:flex;gap:10px;flex-wrap:wrap}
.qrow input{flex:1 1 280px;min-width:0;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:999px;padding-inline:22px;background:var(--sunk)}
.qrow input:focus{border-color:var(--accent);outline:none}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);box-shadow:0 6px 16px rgb(109 85 227 / .3);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mic svg{width:26px;height:26px}
.mic.cam{background:var(--mint-soft);color:var(--mint-ink);border:2px solid var(--mint);box-shadow:none}
.ticket{max-height:260px;max-width:100%;border-radius:16px;border:1px solid var(--line);object-fit:contain;background:#fff;align-self:center}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.choix .btn{padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.choix .btn small{font-weight:400;color:var(--muted)}
.prog{height:10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
video.webcam{width:100%;border-radius:12px;background:#000}
.lu{background:var(--future);color:var(--future-ink);border-radius:16px;padding:10px 12px;font-size:14.5px}
.mic.on{background:var(--debit);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--debit) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.preview{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:38px}
.chip{background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:5px 12px;font-size:14.5px}
.chip b{font-weight:600}
.chip.miss{border-style:dashed;color:var(--warn)}
.hint{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(109 85 227 / .25)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--debit);border-color:color-mix(in srgb,var(--debit) 40%,var(--line))}
.btn.danger.armed{background:var(--debit);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 14px;font-size:14px}

/* registre */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] .count{background:rgb(255 255 255 / .25);color:inherit}
.count{display:inline-block;min-width:22px;padding:0 7px;margin-left:6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.scroll{overflow-x:auto;max-height:62vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
tbody tr.op{cursor:pointer}
tbody tr.op:hover td,tbody tr.rc:hover td{background:var(--sunk)}
tbody tr.rc{cursor:pointer}
tbody tr.rc.on td{background:color-mix(in srgb,var(--credit) 9%,var(--surface))}
.rap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.rap{grid-template-columns:minmax(0,1fr)}.rap .bilan{order:-1}}
.bilan{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.bilan h3{font-size:18px}
.ligne{display:flex;justify-content:space-between;gap:10px}
.ligne.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.ecart{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ecart .big{font-family:var(--f-display);font-size:26px;font-weight:700}
.ecart.ok{background:color-mix(in srgb,var(--credit) 16%,var(--surface));color:var(--credit)}
.ecart.ko{background:color-mix(in srgb,var(--debit) 13%,var(--surface));color:var(--debit)}
.sug{display:flex;flex-direction:column;gap:8px}
.sug li{list-style:none;background:var(--sunk);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.sug ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cb{width:22px;height:22px;accent-color:var(--credit)}
tr.month td{background:var(--sunk);color:var(--accent)!important;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);padding:6px 10px;text-transform:capitalize}
tr.today td{background:var(--accent-soft);font-weight:600;color:var(--accent)}
tr.fut td{background:var(--future);color:var(--future-ink)}
tr.futhead td{background:var(--future);color:var(--future-ink);font-family:var(--f-display);font-weight:700;font-size:15px}
.pt{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.pt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pt svg{width:18px;height:18px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint-ink);border:0;margin-left:6px;white-space:nowrap}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:2px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* formulaires */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);min-width:0}
.sens{display:inline-flex;gap:6px}
.sens button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:9px 14px;font-weight:600}
.sens button[aria-pressed="true"].d{background:var(--debit);border-color:var(--debit);color:var(--surface)}
.sens button[aria-pressed="true"].c{background:var(--credit);border-color:var(--credit);color:var(--surface)}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:20px;height:20px}

.overlay{position:fixed;inset:0;background:rgb(10 16 14 / .45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:26px;box-shadow:0 20px 60px rgb(30 20 90 / .25);width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal h2{font-size:22px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.actions .right{display:flex;gap:10px;flex-wrap:wrap}

.section{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.section h2{font-size:20px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats .chip{display:inline-flex;gap:6px;align-items:center}
.cats .chip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:16px;line-height:1}
.fichier{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.fic{display:inline-flex;align-items:center;gap:8px;background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.btn.fic svg{width:20px;height:20px}
#dropzone{position:fixed;inset:0;z-index:70;background:rgb(109 85 227 / .18);display:grid;place-items:center;padding:16px}
#dropzone div{background:var(--surface);color:var(--accent);font-family:var(--f-display);font-size:22px;font-weight:700;padding:28px 40px;border-radius:26px;border:3px dashed var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .big{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.1}
.stat.alerte .big{color:var(--warn)}
.stat .btn{align-self:flex-start;margin-top:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .area{fill:var(--accent);opacity:.12}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart .zero{stroke:var(--debit);stroke-dasharray:4 4;stroke-width:1.5}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.duo div{background:var(--sunk);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.duo b{font-family:var(--f-display);font-size:20px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(100px,190px) minmax(0,1fr) 52px 104px;gap:12px;align-items:center}
.bar .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.track{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--grad);border-radius:99px}
.bar.autres .track i{background:var(--muted);opacity:.45}
@media (max-width:600px){.bar{grid-template-columns:minmax(0,1fr) 46px 92px}.bar .track{grid-column:1/-1;grid-row:2}}
.hausses{display:flex;flex-direction:column}
.hausse{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.hausse:last-child{border-bottom:0}
.hausse .up{color:var(--debit);font-weight:700;text-align:right}
.mois-nav{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-transform:capitalize}
.mois-nav .btn{padding:6px 12px}
.sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#verrou{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:16px}
#verrou .carte{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
#verrou .logo{margin:0 auto}
#verrou h2{text-align:center}
.lien{background:none;border:0;color:var(--accent);font-weight:600;padding:4px;text-decoration:underline}
.codesecours{font-family:ui-monospace,Consolas,monospace;font-size:28px;letter-spacing:.12em;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:14px;user-select:all}
.imp-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.erreur{color:var(--debit);font-weight:600;font-size:14.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:999px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-weight:600}
@media (max-width:640px){.hide-s{display:none}.brand h1{font-size:24px}.solde .val{font-size:20px}}
</style>

</head><body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">€</div><h1>Mes<span>Comptes</span></h1><button class="btn small" id="lockbtn" data-act="lock" hidden>Verrouiller</button></div>
    <div class="soldes" id="soldes"></div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs">
    <button data-v="ops">Opérations</button>
    <button data-v="ana">Analyse</button>
    <button data-v="ech">Échéances mensuelles</button>
    <button data-v="tiers">Tiers &amp; catégories</button>
    <button data-v="params">Paramètres</button>
  </nav>
  <main id="view"></main>
</div>
<div id="modalroot"></div>
<div id="toastroot"></div>
<input type="file" id="g-imp" accept=".csv,.txt,.qif,.ofx,.qfx,.xls,.xlsx" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
<input type="file" id="g-photo" accept="image/*,.jpg,.jpeg,.png,.heic,.webp,.bmp" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
<input type="file" id="g-cap" accept="image/*,.jpg,.jpeg,.png,.webp,.bmp" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
<div id="dropzone" hidden><div>Lâche l'image ici</div></div>

<script>
/* ===== LOGIQUE (sans interface) ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const round2=n=>Math.round(n*100)/100;

function occurrences(e,afterExcl,toIncl){
  const out=[];const start=fromIso(e.debut);let y=start.getFullYear(),m=start.getMonth();
  const end=fromIso(toIncl);
  while(y<end.getFullYear()||(y===end.getFullYear()&&m<=end.getMonth())){
    const d=iso(new Date(y,m,Math.min(e.jour,dim(y,m))));
    if(d>=e.debut&&(!e.fin||d<=e.fin)&&d>afterExcl&&d<=toIncl)out.push(d);
    m++;if(m>11){m=0;y++}
  }
  return out;
}
function genEcheances(st,today){
  let n=0;
  for(const e of st.echeances){
    const from=e.derniere||addDays(e.debut,-1);
    for(const d of occurrences(e,from,today)){
      st.ops.push({id:uid(),date:d,tiers:e.tiers,cat:e.cat,montant:e.montant,mode:e.mode,note:'Échéance automatique',pointee:false,ech:e.id,cree:Date.now()});n++;
    }
    if(!e.derniere||e.derniere<today)e.derniere=today;
  }
  return n;
}
const JOURS_A_VENIR=20;
function aVenir(st,today,jours=JOURS_A_VENIR){
  const fin=addDays(today,jours),out=[];

function parseOFX(text){

  }

function lireCSV(text){
  text=String(text).replace(/^﻿/,'');
  const lignes=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,15);
  let sep=';',best=-1;
  for(const c of [';','\t','|',',']){
    const n=lignes.map(l=>{let q=false,k=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===c&&!q)k++}return k}).filter(x=>x>0).sort((a,b)=>a-b);
    const med=n.length?n[Math.floor(n.length/2)]:0;const sc=med*(n.length/Math.max(1,lignes.length));
    if(sc>best+0.01){best=sc;sep=c}
  }
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(c=>c.trim()))rows.push(row);row=[];cell=''}

function trouverEntete(rows){

  const map={},pris=new Set();const H=entete.map(c=>norm(c).trim());

  if(map.montant!=null&&(map.debit!=null||map.credit!=null)){delete map.debit;delete map.credit}

function moisPrec(cle){let[y,m]=cle.split('-').map(Number);m--;if(m<1){m=12;y--}return y+'-'+pad(m)}
function moisSuiv(cle){let[y,m]=cle.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+pad(m)}
function depensesParTiers(st,debut,fin){
  const m=new Map();
  for(const o of st.ops){if(o.montant>=0||o.date<debut||o.date>fin)continue;m.set(o.tiers,(m.get(o.tiers)||0)-o.montant)}
  return[...m].map(([tiers,total])=>({tiers,total:round2(total)})).sort((a,b)=>b.total-a.total);
}
function hausses(st,cle,today){
  const p=moisPrec(cle),fin=cle+'-31'>today?today:cle+'-31';
  const avant=new Map(depensesParTiers(st,p+'-01',p+'-31').map(x=>[x.tiers,x.total]));
  const out=[];
  for(const x of depensesParTiers(st,cle+'-01',fin)){const a=avant.get(x.tiers)||0;
    if(a>0&&x.total-a>=1&&x.total>a*1.03)out.push({tiers:x.tiers,avant:a,apres:x.total,diff:round2(x.total-a),pct:Math.round((x.total/a-1)*100)})}
  return out.sort((a,b)=>b.diff-a.diff);
}
function serieSolde(st,today,nbMois=12){
  const ops=st.ops.filter(o=>o.date<=today).sort((a,b)=>a.date.localeCompare(b.date));
  let cle=today.slice(0,7);const cles=[];for(let i=0;i<nbMois;i++){cles.unshift(cle);cle=moisPrec(cle)}
  const pts=[];let solde=st.soldeInitial.montant,i=0;
  for(const c of cles){const fin=c===today.slice(0,7)?today:c+'-31';while(i<ops.length&&ops[i].date<=fin){solde+=ops[i].montant;i++}pts.push({cle:c,solde:round2(solde)})}
  return pts;
}
function bilanMois(st,cle,today){
  let e=0,d=0;const fin=cle+'-31'>today?today:cle+'-31';
  for(const o of st.ops){if(o.date<cle+'-01'||o.date>fin)continue;if(o.montant>0)e+=o.montant;else d-=o.montant}
  return{entrees:round2(e),sorties:round2(d)};
}
function soldes(st,today){
  let jour=st.soldeInitial.montant,banque=st.soldeInitial.montant,futur=0;
  for(const o of st.ops){if(o.date<=today)jour+=o.montant;else futur+=o.montant;if(o.pointee)banque+=o.montant}
  const venir=aVenir(st,today).reduce((s,x)=>s+x.montant,0);
  return{jour:round2(jour),banque:round2(banque),prevu:round2(jour+futur+venir)};
}

/* micro */
let reco=null;
function dicter(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("La dictée n'est pas disponible dans ce navigateur. Utilise Microsoft Edge ou Google Chrome.");return}
  if(reco){reco.stop();return}
  try{reco=new SR()}catch(e){toast("Impossible de lancer la dictée ici.");return}
  reco.lang='fr-FR';reco.interimResults=true;reco.maxAlternatives=1;
  const mic=$('#mic');mic.classList.add('on');
  reco.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;quickTxt=s;$('#q').value=s;majPreview()};
  reco.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?"Le micro est bloqué ici. Dans cet aperçu, tape la phrase : c'est exactement le même fonctionnement.":"Je n'ai pas compris. Réessaie en parlant près du micro.")};
  reco.onend=()=>{reco=null;const m=$('#mic');if(m)m.classList.remove('on')};
  try{reco.start()}catch(e){reco=null;mic.classList.remove('on')}
}

const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker=null,flux=null;
function chargerScript(src){return new Promise((ok,ko)=>{if(window.Tesseract)return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)})}
function modalPhoto(){

async function webcam(){
  try{flux=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){toast("La caméra n'est pas accessible ici. Dans l'appli installée, Edge demandera l'autorisation.");return}
  $('#ph-zone').innerHTML='<video class="webcam" id="ph-v" autoplay playsinline></video><button class="btn primary" id="ph-snap" style="margin-top:10px">Prendre la photo</button>';
  $('#ph-v').srcObject=flux;
  $('#ph-snap').onclick=()=>{const v=$('#ph-v'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);stopCam();analyser(c.toDataURL('image/jpeg',.92))};
}
function stopCam(){if(flux){flux.getTracks().forEach(t=>t.stop());flux=null}}
function preparer(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{
  const k=Math.min(2,2400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const g=c.getContext('2d');g.filter='grayscale(1) contrast(1.4)';g.drawImage(im,0,0,c.width,c.height);ok({ocr:c.toDataURL('image/png'),vue:src})};im.src=src})}
async function lireImage(src,zone,quoi){
  $(zone).innerHTML=`<div class="hint" id="ph-st">Lecture ${quoi}…</div><div class="prog"><i id="ph-p"></i></div>`;
  const img=await preparer(src);
  await chargerScript(TESS);
  if(!ocrWorker)ocrWorker=await Tesseract.createWorker('fra',1,{logger:m=>{const b=$('#ph-p');if(b&&m.progress!=null)b.style.width=Math.round(m.progress*100)+'%';const st=$('#ph-st');if(st&&m.status==='recognizing text')st.textContent='Lecture… '+Math.round(m.progress*100)+' %'}});
  const {data}=await ocrWorker.recognize(img.ocr);
  return data.text;
}
async function analyser(src){

  if(!rap){vue='ops';return vueOps()}
  const T=todayIso(),list=S.ops.filter(o=>!o.pointee).sort((a,b)=>a.date.localeCompare(b.date)||(a.cree||0)-(b.cree||0));
  const v=verifRappro(S,rap.coches,rap.solde);rapSug=v.suggestions;const ok=v.ecart===0;
  const txt=s=>{const o=s.op,lab=o?`<b>${h(o.tiers)}</b> du ${dCourt(o.date)} (${fmt(Math.abs(o.montant))})`:'';
    if(s.type==='cocher')return[`${lab} n'est pas cochée : elle est peut-être passée à la banque.`,'La cocher'];
    if(s.type==='decocher')return[`${lab} est cochée mais n'est peut-être pas encore passée à la banque.`,'La décocher'];
    if(s.type==='sens')return[`${lab} est peut-être un ${o.montant<0?'crédit':'débit'} et non un ${o.montant<0?'débit':'crédit'}.`,'Inverser le sens'];
    if(s.type==='montant')return[`${lab} : le bon montant est peut-être ${fmt(Math.abs(s.nouveau))} (faute de frappe ?).`,`Corriger en ${fmt(Math.abs(s.nouveau))}`];
    return[`Il manque peut-être une opération de <b>${fmt(Math.abs(s.montant))}</b> en ${s.montant<0?'débit':'crédit'} (frais bancaires, oubli…).`,'Ajouter cette opération']};
  $('#view').innerHTML=`<div class="rap">
   <section class="panel">
    <div class="phead"><div><h2 style="font-size:20px">Rapprochement</h2><div class="hint">Coche chaque opération qui apparaît sur le compte à la banque. Clique sur une ligne pour la cocher.</div></div>
     <div class="row"><button class="btn small" data-act="rapall">Tout cocher jusqu'à aujourd'hui</button><button class="btn small" data-act="rapnone">Tout décocher</button><button class="btn small" data-act="newop">+ Opération oubliée</button></div></div>
    <div class="scroll">${list.length?`<table><thead><tr><th style="width:44px" aria-label="Cochée"></th><th>Date</th><th>Tiers</th><th class="hide-s">Catégorie</th><th class="r">Débit</th><th class="r">Crédit</th><th></th></tr></thead><tbody>
     ${list.map(o=>{const c=rap.coches.has(o.id);return`<tr class="rc ${c?'on':''}" data-rc="${o.id}">
      <td><input type="checkbox" class="cb" ${c?'checked':''} tabindex="-1" aria-label="Cocher ${h(o.tiers)}"></td>
      <td class="num">${dCourt(o.date)}</td><td>${h(o.tiers)}${o.ech?'<span class="tag">auto</span>':''}${o.date>T?'<span class="tag">à venir</span>':''}${o.note&&o.note!=='Échéance automatique'?`<div class="note">${h(o.note)}</div>`:''}</td>
      <td class="hide-s">${h(o.cat)}</td><td class="r num debit">${o.montant<0?fmt(-o.montant):''}</td><td class="r num credit">${o.montant>0?fmt(o.montant):''}</td>
      <td class="r"><button class="btn small" data-edit="${o.id}">Modifier</button></td></tr>`}).join('')}
     </tbody></table>`:'<div class="empty">Toutes les opérations sont déjà pointées. Si le solde ne correspond pas, ajoute l\'opération oubliée.</div>'}</div>
   </section>
   <aside class="bilan">
    <h3>Vérification</h3>
    <div class="ligne"><span class="muted">Dernier solde pointé</span><span class="num">${fmt(v.depart)}</span></div>
    <div class="ligne"><span class="muted">+ ${v.nb} opération${v.nb>1?'s':''} cochée${v.nb>1?'s':''}</span><span class="num">${fmt(round2(v.calcule-v.depart))}</span></div>
    <div class="ligne tot"><span>Solde calculé</span><span class="num">${fmt(v.calcule)}</span></div>
    <div class="ligne"><span>Solde à la banque</span><span class="num"><b>${fmt(rap.solde)}</b> <button class="btn small" data-act="rapsolde">Modifier</button></span></div>

    ${ok?'':`<div class="sug"><b>Pistes pour trouver l'erreur</b><ul>${rapSug.map((s,i)=>{const[t,b]=txt(s);return`<li><span>${t}</span><button class="btn small" data-sug="${i}">${b}</button></li>`}).join('')}</ul></div>`}
    <button class="btn primary" data-act="rapok" ${ok?'':'disabled'}>Valider le rapprochement</button>
    <button class="btn" data-act="rapstop">Abandonner (rien n'est changé)</button>
   </aside></div>`;
}
function actionSug(s){
  if(s.type==='cocher')rap.coches.add(s.op.id);
  else if(s.type==='decocher')rap.coches.delete(s.op.id);
  else if(s.type==='sens'){s.op.montant=-s.op.montant;save();toast('Sens inversé')}
  else if(s.type==='montant'){s.op.montant=s.nouveau;save();toast('Montant corrigé')}
  else{modalOp(null,{date:todayIso(),tiers:'',cat:'À classer',abs:Math.abs(s.montant),sens:s.montant>0?'credit':'debit',mode:'Prélèvement',note:'Ajoutée au rapprochement'});return}
  render();
}

function telecharger(nom,contenu,type){

  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);

function exporterCSV(){
  const c=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const n=v=>v?String(v.toFixed(2)).replace('.',','):'';
  const L=['Date;Tiers;Catégorie;Mode;Débit;Crédit;Pointée;Note'];
  for(const o of [...S.ops].sort((a,b)=>a.date.localeCompare(b.date))){const[y,m,d]=o.date.split('-');
    L.push([`${d}/${m}/${y}`,c(o.tiers),c(o.cat),c(o.mode),n(o.montant<0?-o.montant:0),n(o.montant>0?o.montant:0),o.pointee?'Oui':'Non',c(o.note)].join(';'))}
  telecharger(`MesComptes-operations-${todayIso()}.csv`,'﻿'+L.join('\r\n'),'text/csv;charset=utf-8');
}

const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function chargerLib(src,glob){return new Promise((ok,ko)=>{if(window[glob])return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)})}
function decoderTexte(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
$('#g-imp').onchange=e=>{const f=e.target.files[0];if(f)ouvrirFichierImport(f)};
async function ouvrirFichierImport(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();let buf;
  try{buf=await f.arrayBuffer()}catch(e){toast("Impossible d'ouvrir ce fichier.");return}
  if(ext==='xls'||ext==='xlsx'){
    try{await chargerLib(XLSX_URL,'XLSX')}catch(e){toast("Pour lire un fichier Excel, il faut Internet la première fois. Sinon, exporte en CSV.");return}
    try{const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(r=>r.map(v=>v instanceof Date?`${pad(v.getDate())}/${pad(v.getMonth()+1)}/${v.getFullYear()}`:String(v??'').trim()));
      modalColonnes(rows,f.name)}catch(e){toast("Ce fichier Excel n'a pas pu être lu.")}
    return;
  }
  const texte=decoderTexte(buf);
  if(ext==='qif'||/^\s*!(type|account|option)/i.test(texte)){const r=parseQIF(texte);return r.recs.length?modalImport(r,f.name):toast("Aucune opération trouvée dans ce fichier QIF.")}
  if(ext==='ofx'||ext==='qfx'||/<OFX>/i.test(texte)){const r=parseOFX(texte);return r.recs.length?modalImport(r,f.name):toast("Aucune opération trouvée dans ce fichier OFX.")}
  const rows=lireCSV(texte);if(rows.length<2){toast("Ce fichier ne contient pas de tableau d'opérations.");return}
  modalColonnes(rows,f.name);
}

    let k=0;const base=Date.now();

let anaMois=null,anaPer='mois';
const nomMois=c=>fromIso(c+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
function graphSolde(pts){
  const W=720,H=230,L=64,R=18,Tp=16,B=34;const v=pts.map(p=>p.solde);
  let mn=Math.min(...v,0<Math.min(...v)?Math.min(...v):0),mx=Math.max(...v);if(mx===mn){mx+=100;mn-=100}
  const pas=Math.pow(10,Math.floor(Math.log10((mx-mn)/3||1)));const st=[1,2,2.5,5,10].map(x=>x*pas).find(x=>(mx-mn)/x<=4)||pas*10;
  mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const X=i=>L+i*(W-L-R)/Math.max(1,pts.length-1),Y=x=>Tp+(mx-x)*(H-Tp-B)/(mx-mn);
  let g='';for(let t=mn;t<=mx+1e-9;t+=st)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L-8}" y="${Y(t)+4}" text-anchor="end">${Math.round(t).toLocaleString('fr-FR')} €</text>`;
  if(mn<0&&mx>0)g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.solde).toFixed(1)}`).join('');
  const lab=pts.map((p,i)=>(i%2===pts.length%2||i===pts.length-1)?`<text class="ax" x="${X(i)}" y="${H-10}" text-anchor="middle">${fromIso(p.cle+'-01').toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</text>`:'').join('');
  const n=pts.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du solde sur 12 mois">${g}<path class="area" d="${d}L${X(n)},${Y(Math.max(mn,0)<=mn?mn:0)}L${X(0)},${Y(Math.max(mn,0)<=mn?mn:0)}Z"/><path class="ln" d="${d}"/><circle class="dot" cx="${X(n)}" cy="${Y(pts[n].solde)}" r="6"/>${lab}</svg>`;
}

}

/* --- Compte utilisateur --- */
let verrouille=false,derniereAct=Date.now();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hacher(mdp,selB64){
  if(!(window.crypto&&crypto.subtle))throw new Error('crypto');
  const sel=selB64?unb64(selB64):crypto.getRandomValues(new Uint8Array(16));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(mdp),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:sel,iterations:150000,hash:'SHA-256'},k,256);
  return{sel:b64(sel),hash:b64(bits)};
}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function nouveauCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(8));const c=[...r].map(x=>A[x%A.length]).join('');return c.slice(0,4)+'-'+c.slice(4)}
async function definirCompte(nom,mdp){
  const p=await hacher(mdp),code=nouveauCode(),c=await hacher(normCode(code));
  S.utilisateur={nom,sel:p.sel,hash:p.hash,selCode:c.sel,hashCode:c.hash};save();return code;
}
function montrerCode(code,titre){
  openModal(`<h2>${titre}</h2>
   <div class="hint">Voici le <b>code de secours</b>. Il sert à choisir un nouveau mot de passe en cas d'oubli. Note-le sur papier et range-le avec les papiers de la banque : il ne sera plus affiché.</div>
   <div class="codesecours">${code}</div>
   <div class="actions"><div></div><div class="right"><button class="btn primary" data-close>C'est noté</button></div></div>`);
}
function afficherVerrou(mode){
  closeModal();$('#app').hidden=true;let v=$('#verrou');if(!v){v=document.createElement('div');v.id='verrou';document.body.appendChild(v)}
  const U=S.utilisateur;
  v.innerHTML=mode==='oubli'?`<div class="carte"><div class="logo" aria-hidden="true">€</div><h2>Nouveau mot de passe</h2>
    <label class="field"><span>Code de secours</span><input id="v-code" autocomplete="off" placeholder="XXXX-XXXX"></label>
    <label class="field"><span>Nouveau mot de passe</span><input id="v-n1" type="password" autocomplete="new-password"></label>
    <label class="field"><span>Confirmer</span><input id="v-n2" type="password" autocomplete="new-password"></label>
    <div class="erreur" id="v-err"></div><button class="btn primary" id="v-ok">Valider</button><button class="lien" id="v-retour">Retour</button></div>`
  :`<div class="carte"><div class="logo" aria-hidden="true">€</div><h2>Bonjour ${h(U.nom)}</h2>
    <label class="field"><span>Mot de passe</span><input id="v-mdp" type="password" autocomplete="current-password"></label>
    <div class="erreur" id="v-err"></div><button class="btn primary" id="v-ok">Ouvrir mes comptes</button><button class="lien" id="v-oubli">Mot de passe oublié ?</button></div>`;
  const err=t=>$('#v-err').textContent=t;
  if(mode==='oubli'){
    $('#v-retour').onclick=()=>afficherVerrou();
    $('#v-ok').onclick=async()=>{const n1=$('#v-n1').value,n2=$('#v-n2').value;
      if(n1.length<6)return err('Le mot de passe doit faire au moins 6 caractères.');if(n1!==n2)return err('Les deux mots de passe sont différents.');
      const c=await hacher(normCode($('#v-code').value),U.selCode);if(c.hash!==U.hashCode)return err('Code de secours incorrect.');
      const code=await definirCompte(U.nom,n1);ouvrir();montrerCode(code,'Mot de passe changé')};
    $('#v-code').focus();
  }else{
    const go=async()=>{try{const p=await hacher($('#v-mdp').value,U.sel);if(p.hash===U.hash)ouvrir();else{err('Mot de passe incorrect.');$('#v-mdp').select()}}catch(e){err("Le déverrouillage n'est pas possible dans ce navigateur.")}};
    $('#v-ok').onclick=go;$('#v-mdp').onkeydown=e=>{if(e.key==='Enter')go()};$('#v-oubli').onclick=()=>afficherVerrou('oubli');
    $('#v-mdp').focus();
  }
}
function ouvrir(){verrouille=false;derniereAct=Date.now();const v=$('#verrou');if(v)v.remove();$('#app').hidden=false;render()}
function verrouiller(){if(!S.utilisateur)return;verrouille=true;afficherVerrou()}
function demarrer(){if(S.utilisateur){verrouille=true;afficherVerrou()}else render()}
['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>derniereAct=Date.now(),{passive:true}));
setInterval(()=>{if(S.utilisateur&&!verrouille&&Date.now()-derniereAct>15*60*1000)verrouiller()},30000);
async function creerCompte(){
  const nom=$('#u-nom').value.trim(),m1=$('#u-mdp').value,m2=$('#u-mdp2').value;
  if(!nom)return toast('Indique un prénom ou un nom.');if(m1.length<6)return toast('Le mot de passe doit faire au moins 6 caractères.');if(m1!==m2)return toast('Les deux mots de passe sont différents.');
  try{const code=await definirCompte(nom,m1);render();montrerCode(code,'Compte créé')}catch(e){toast("Impossible de créer le compte dans ce navigateur.")}
}
function modalMdp(supprimer){
  openModal(`<h2>${supprimer?'Supprimer le mot de passe':'Changer le mot de passe'}</h2>
   <label class="field"><span>Mot de passe actuel</span><input id="c-old" type="password" autocomplete="current-password"></label>
   ${supprimer?'<div class="hint">L\'appli s\'ouvrira ensuite sans mot de passe.</div>':`<label class="field"><span>Nouveau mot de passe</span><input id="c-n1" type="password" autocomplete="new-password"></label><label class="field"><span>Confirmer</span><input id="c-n2" type="password" autocomplete="new-password"></label>`}
   <div class="actions"><div></div><div class="right"><button class="btn" data-close>Annuler</button><button class="btn ${supprimer?'danger':'primary'}" id="c-ok">${supprimer?'Supprimer':'Changer'}</button></div></div>`);
  $('#c-ok').onclick=async()=>{const U=S.utilisateur,p=await hacher($('#c-old').value,U.sel);if(p.hash!==U.hash)return toast('Mot de passe actuel incorrect.');
    if(supprimer){delete S.utilisateur;save();closeModal();render();return toast('Mot de passe supprimé')}
    const n1=$('#c-n1').value;if(n1.length<6)return toast('Le mot de passe doit faire au moins 6 caractères.');if(n1!==$('#c-n2').value)return toast('Les deux mots de passe sont différents.');
    const code=await definirCompte(U.nom,n1);closeModal();render();montrerCode(code,'Mot de passe changé')};
}

/* --- Modale & toast --- */
function openModal(html){$('#modalroot').innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#modalroot').querySelector('input,select');if(f)f.focus()}
function closeModal(){if(typeof stopCam==='function')stopCam();$('#modalroot').innerHTML=''}
let toastTimer;
function toast(msg,undo){clearTimeout(toastTimer);
  $('#toastroot').innerHTML=`<div class="toast" role="status"><span>${h(msg)}</span>${undo?'<button id="undo">Annuler</button>':''}</div>`;
  if(undo)$('#undo').onclick=()=>{undo();$('#toastroot').innerHTML='';};
  toastTimer=setTimeout(()=>$('#toastroot').innerHTML='',undo?7000:5000)}

/* --- Événements --- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr,[data-close],.overlay');if(!t)return;
  if(e.target.id==='ov'){closeModal();return}
  if(t.matches('[data-close]')){closeModal();return}
  if(t.matches('#tabs button')){vue=t.dataset.v;render();return}
  if(t.matches('[data-per]')){anaPer=t.dataset.per;vueAna();return}
  if(t.matches('[data-f]')){filtre=t.dataset.f;vueOps();return}
  if(t.matches('[data-sug]')){actionSug(rapSug[+t.dataset.sug]);return}
  if(t.matches('tr[data-rc]')){const id=t.dataset.rc;rap.coches.has(id)?rap.coches.delete(id):rap.coches.add(id);const sc=document.querySelector('.rap .scroll').scrollTop;render();document.querySelector('.rap .scroll').scrollTop=sc;return}
  if(t.matches('[data-pt]')){e.stopPropagation();const o=S.ops.find(x=>x.id===t.dataset.pt);o.pointee=!o.pointee;save();const sc=$('#reg').scrollTop;renderSoldes();vueOps();$('#reg').scrollTop=sc;return}
  if(t.matches('#mic')){dicter();return}
  if(t.matches('#cam')){modalPhoto();return}
  if(t.matches('[data-edit]')||t.matches('tr.op[data-id]')){modalOp(S.ops.find(x=>x.id===(t.dataset.edit||t.dataset.id)));return}
  if(t.matches('[data-ech]')){modalEch(S.echeances.find(x=>x.id===t.dataset.ech));return}
  if(t.matches('[data-tiers]')){modalTiers(S.tiers.find(x=>x.id===t.dataset.tiers));return}
  if(t.matches('[data-delcat]')){S.categories.splice(+t.dataset.delcat,1);save();vueTiers();return}
  const act=t.dataset.act;
  if(act==='quicksave')quickSave();
  if(act==='quickedit'){const r=parseSaisie(quickTxt,S,todayIso());modalOp(null,{date:r.date,tiers:r.tiers||'',cat:r.cat,abs:r.montant??'',sens:r.sens,mode:r.mode,note:quickNote.trim()||r.note})}
  if(act==='newop')modalOp(null);
  if(act==='rappro')modalRappro();
  if(act==='importfile'){const i=$('#g-imp');i.value='';try{i.showPicker?i.showPicker():i.click()}catch(e){i.click()}}
  if(act==='tout'){toutHisto=true;vueOps()}
  if(act==='exportcsv')exporterCSV();
  if(act==='lock')verrouiller();
  if(act==='creercompte')creerCompte();
  if(act==='chgmdp')modalMdp(false);
  if(act==='supmdp')modalMdp(true);
  if(act==='voirnp'){vue='ops';filtre='np';render()}
  if(act==='anaprev'){anaMois=moisPrec(anaMois);vueAna()}
  if(act==='anasuiv'){anaMois=moisSuiv(anaMois);vueAna()}
  if(act==='rapsolde'){const cur=rap;modalRappro();$('#r-solde').value=String(cur.solde).replace('.',',');const ok=$('#r-ok');ok.onclick=()=>{const v=parseSigne($('#r-solde').value);if(v==null)return;cur.solde=v;rap=cur;closeModal();render()}}
  if(act==='rapall'){S.ops.forEach(o=>{if(!o.pointee&&o.date<=todayIso())rap.coches.add(o.id)});render()}
  if(act==='rapnone'){rap.coches.clear();render()}
  if(act==='rapstop'){rap=null;vue='ops';render()}
  if(act==='rapok'){const v=verifRappro(S,rap.coches,rap.solde);if(v.ecart!==0)return;
    S.ops.forEach(o=>{if(rap.coches.has(o.id))o.pointee=true});
    (S.rapprochements=S.rapprochements||[]).push({date:todayIso(),solde:rap.solde,nb:v.nb});
    rap=null;vue='ops';save();render();toast(`Rapprochement validé : ${v.nb} opération${v.nb>1?'s':''} pointée${v.nb>1?'s':''}, tout est juste.`)}
  if(act==='newech')modalEch(null);
  if(act==='capech')modalCapture();
  if(act==='pickphoto')choisir('#g-photo');
  if(act==='pickcap')choisir('#g-cap');
  if(act==='newtiers')modalTiers(null);
  if(act==='addcat'){const v=$('#newcat').value.trim();if(v&&!S.categories.includes(v)){S.categories.splice(S.categories.length-1,0,v);save();vueTiers()}}
  if(act==='savesolde'){const m=$('#p-solde').value;const n=parseFloat(m.replace(/\s/g,'').replace(',','.'));if(isNaN(n)){toast('Montant invalide.');return}S.soldeInitial={montant:round2(n),date:$('#p-date').value||todayIso()};save();render();toast('Solde de départ enregistré')}
  if(act==='export')exporter();
  if(act==='goparams'){vue='params';render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){quickTxt=e.target.value;majPreview()}if(e.target.id==='qn'){quickNote=e.target.value;majPreview()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ov'))closeModal();
  if(e.key==='Enter'&&(e.target.id==='q'||e.target.id==='qn')){e.preventDefault();quickSave()}
  if(e.key==='Enter'&&e.target.id==='newcat'){e.preventDefault();document.querySelector('[data-act="addcat"]').click()}
});
// Vérifie les échéances si l'appli reste ouverte d'un jour à l'autre
setInterval(()=>{if(genEcheances(S,todayIso())){save();if(!$('#ov')&&!verrouille)render()}},60000);
demarrer();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
